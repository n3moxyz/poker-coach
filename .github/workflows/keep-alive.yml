name: Keep Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://poker-coach.onrender.com/api/health)
          echo "Health check response: $response"
          if [ "$response" != "200" ]; then
            echo "Warning: API returned $response"
            exit 1
          fi
          echo "API is healthy"
